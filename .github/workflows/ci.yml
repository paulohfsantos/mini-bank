name: CI

on:
  pull_request:
  push:
    branches: [master]

# Permissões mínimas por padrão; jobs pedem mais só quando precisam.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, format, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions fixadas por SHA de commit, não por tag (SEC-32). O comentário diz a versão.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Usa a versão do campo "packageManager" do package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # SDD: contrato válido, tipos gerados em dia, IDs de AC citados nos testes existem e
      # ACC/TRF/STM cobertos em todos os níveis exigidos pela spec (--require).
      - name: Specs
        run: pnpm specs:check

  integration:
    name: integration + e2e (Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Postgres real em container (imagem fixada em packages/database/src/testing);
      # o Docker já vem no runner. Migrations aplicadas pelo dbmate num banco template.
      - name: Integration
        run: pnpm test:integration

      - name: E2E
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  web-e2e:
    name: web e2e (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Só valores de laboratório (.env.example); a API key do CI é a mesma do exemplo.
      - name: Env
        run: cp .env.example .env

      - name: Infra
        run: pnpm infra:up && pnpm db:migrate

      # Download explícito do navegador (scripts de instalação continuam bloqueados, SEC-32).
      - name: Chromium
        run: pnpm --filter @mini-banco/web exec playwright install --with-deps chromium

      # Build de produção + fluxo no navegador + varredura do .next/static pela key (WEB-AC-08).
      - name: Web e2e
        run: pnpm test:web
