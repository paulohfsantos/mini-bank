version: 2
updates:
  - package-ecosystem: npm # cobre pnpm (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
    # Cooldown (SEC-32): só propõe versões publicadas há alguns dias.
    cooldown:
      default-days: 3
    groups:
      dev-tooling:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    ignore:
      # A major do Postgres acompanha a do RDS e muda o layout do volume (a 18 usa
      # /var/lib/postgresql/18/docker). Upgrade de major é tarefa própria, não PR automático.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']

  # Providers do Terraform (lock files de bootstrap e lab). Versões fixadas com ~> no patch:
  # cada minor nova chega por PR, depois do cooldown.
  - package-ecosystem: terraform
    directories: ['/infra/bootstrap', '/infra/envs/lab']
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  # Imagem base do Dockerfile (node:<versão>-bookworm-slim).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      # A major do Node acompanha o .nvmrc; upgrade de major é tarefa própria.
      - dependency-name: node
        update-types: ['version-update:semver-major']
