version: 2
updates:
  - package-ecosystem: npm # cobre pnpm (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
    # Cooldown (SEC-32): só propõe versões publicadas há alguns dias.
    cooldown:
      default-days: 3
    groups:
      dev-tooling:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    ignore:
      # A major do Postgres acompanha a do RDS e muda o layout do volume (a 18 usa
      # /var/lib/postgresql/18/docker). Upgrade de major é tarefa própria, não PR automático.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
