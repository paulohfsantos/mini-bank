packages:
  - apps/*
  - packages/*

# Supply chain (SEC-32): scripts de instalação de dependências ficam bloqueados por padrão.
# Só os pacotes listados aqui podem rodar build scripts; qualquer novo pedido exige revisão.
allowBuilds:
  '@swc/core': true
  # Dependência do Spectral cujo postinstall só envia telemetria de instalação. Negado.
  '@scarf/scarf': false
  # Cliente Docker do Testcontainers (dockerode). ssh2/cpu-features compilam crypto nativa
  # opcional, só usada com Docker via SSH (usamos o socket local; há fallback em JS puro).
  # O postinstall do protobufjs só confere versões. Todos negados.
  ssh2: false
  cpu-features: false
  protobufjs: false

# Supply chain (SEC-32): não instala versões publicadas há menos de 1 dia (em minutos).
# Dá tempo para que pacotes comprometidos sejam detectados e despublicados.
minimumReleaseAge: 1440

# Versões compartilhadas entre os pacotes (referenciadas como "catalog:").
# TypeScript fica em 6.0.x: o typescript-eslint ainda não suporta o TypeScript 7 (port em Go).
catalog:
  typescript: 6.0.3
  '@types/node': ^26.0.0

# openapi-typescript declara peer typescript ^5.x, mas gera corretamente com 6.0
# (verificado na fase 1). Revisar ao atualizar qualquer um dos dois.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: '6'

# Correções de segurança em dependências transitivas de ferramentas de desenvolvimento:
# - minimatch < 11.0.1 (DoS por globparts), via @swc/cli;
# - glob 9.0.0–14.0.1 (GHSA-g3hv-75wg-m249), via archiver do Testcontainers.
# Remover quando as dependências trouxerem as faixas corrigidas (pnpm audit no CI avisa).
overrides:
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  'glob@>=9.0.0 <14.0.2': ^14.0.2
