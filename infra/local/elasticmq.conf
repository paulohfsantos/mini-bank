# ElasticMQ: SQS compatível para desenvolvimento local (ADR-0022).
# Espelha a configuração da fila na AWS (docs/aws.md §2.2):
# visibility 30 s, long polling 20 s, DLQ com maxReceiveCount = 5.
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # Aplica os limites reais do SQS (tamanho de mensagem, lote de 10 etc.).
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

generate-node-address = false

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  mini-banco-transfer-events-dlq {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }

  mini-banco-transfer-events {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "mini-banco-transfer-events-dlq"
      maxReceiveCount = 5
    }
  }
}
